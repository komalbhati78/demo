<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K.K Photography — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --bar: #FFFFFF;
    --bar-soft: #F7F5F1;
    --text: #241F1A;
    --text-muted: #746C60;
    --border: #E7E2D8;
    --accent: #A9791F;
    --accent-light: #C79A34;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }

  body{
    font-family:'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* ---------- primary navbar ---------- */
  .navbar-primary{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    background: var(--accent);
    padding:16px 32px;
    position:relative;
    z-index:5;
    flex-wrap:wrap;
    row-gap:12px;
  }

  .brand{
    font-family:'Playfair Display', serif;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-size:1.25rem;
    color:#FFFFFF;
    white-space:nowrap;
  }

  .nav-center{
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
    flex:1;
  }

  .device-icon{
    width:34px;
    height:34px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.12);
    color:#FFFFFF;
    cursor:pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
    flex-shrink:0;
  }

  .device-icon:hover{
    border-color:#FFFFFF;
    background: rgba(255,255,255,0.22);
  }

  .device-icon svg{ width:18px; height:18px; }

  .read-more{
    font-size:0.88rem;
    color:#FFFFFF;
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition: border-color 0.2s ease, opacity 0.2s ease;
    white-space:nowrap;
    opacity:0.92;
  }

  .read-more:hover{
    opacity:1;
    border-color:#FFFFFF;
  }

  .edit-btn{
    font-size:0.85rem;
    font-weight:500;
    color:#FFFFFF;
    background: transparent;
    border:1px solid #FFFFFF;
    border-radius:6px;
    padding:9px 16px;
    cursor:pointer;
    white-space:nowrap;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .edit-btn:hover{
    background:#FFFFFF;
    color: var(--accent);
  }

  /* ---------- secondary navbar ---------- */
  .navbar-secondary{
    background: var(--bar-soft);
    border-bottom:1px solid var(--border);
    padding:12px 32px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    position:relative;
    z-index:5;
  }

  .studio-name{
    font-family:'Playfair Display', serif;
    font-size:1rem;
    letter-spacing:0.03em;
    color: var(--text);
  }

  .navbar-secondary .home-link{
    justify-self:center;
    font-size:0.85rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color: var(--accent);
    text-decoration:none;
  }

  /* ---------- hero / slideshow ---------- */
  .hero{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    min-height:600px;
    text-align:center;
  }

  .slide{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    transform: scale(1.08);
    animation: slideFade 16s infinite;
  }

  .slide1{
    background-image:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1800&q=80');
    animation-delay:0s;
  }
  .slide2{
    background-image:url('https://images.unsplash.com/photo-1519638399535-1b036603ac77?w=1800&q=80');
    animation-delay:5.3s;
  }
  .slide3{
    background-image:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1800&q=80');
    animation-delay:10.6s;
  }

  @keyframes slideFade{
    0%{ opacity:0; transform: scale(1.08) translateX(0); }
    6%{ opacity:1; }
    28%{ opacity:1; transform: scale(1.16) translateX(-2%); }
    36%{ opacity:0; transform: scale(1.16) translateX(-2%); }
    100%{ opacity:0; transform: scale(1.16) translateX(-2%); }
  }

  .hero-overlay{
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(20,17,14,0.28) 45%, rgba(20,17,14,0.62) 100%);
    z-index:1;
  }

  .hero-content{
    position:relative;
    z-index:2;
    padding: 40px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .hero-content h1{
    font-family:'Playfair Display', serif;
    font-size: clamp(2.4rem, 7vw, 4.8rem);
    font-weight:700;
    letter-spacing:-0.01em;
    line-height:1.08;
    margin-bottom:36px;
    color:#FFFFFF;
    text-shadow: 0 8px 30px rgba(0,0,0,0.55);
  }

  .notify-card{
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,0.9);
    border-radius:14px;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
    max-width:420px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.18);
  }

  .notify-card input{
    width:100%;
    padding:13px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background: #FFFFFF;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size:0.95rem;
    outline:none;
  }

  .notify-card input::placeholder{ color:#9A9184; }

  .notify-card label{
    font-size:0.82rem;
    font-weight:500;
    color: var(--text);
    text-align:left;
  }

  .notify-check{
    display:flex;
    align-items:flex-start;
    gap:9px;
    text-align:left;
  }

  .notify-check input[type="checkbox"]{
    width:16px;
    height:16px;
    margin-top:2px;
    accent-color: var(--accent);
    flex-shrink:0;
    padding:0;
  }

  .notify-check span{
    font-size:0.82rem;
    line-height:1.45;
    color: var(--text-muted);
  }

  .notify-btn{
    position:relative;
    overflow:hidden;
    font-size:0.92rem;
    font-weight:600;
    color:#FFFFFF;
    background: var(--accent);
    border:none;
    border-radius:8px;
    padding:14px 20px;
    cursor:pointer;
    animation: pulse 2.8s ease-in-out infinite;
    transition: transform 0.18s ease, background 0.18s ease;
  }

  .notify-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-60%;
    width:40%;
    height:100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg);
  }

  .notify-btn:hover{
    background: var(--accent-light);
    transform: translateY(-2px);
  }

  .notify-btn:hover::before{
    animation: shimmer 0.9s ease forwards;
  }

  @keyframes shimmer{ to{ left:120%; } }

  @keyframes pulse{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(169,121,31,0.4); }
    50%{ box-shadow: 0 0 0 10px rgba(169,121,31,0); }
  }

  @media (prefers-reduced-motion: reduce){
    .slide{ animation:none; opacity:1; }
    .slide2, .slide3{ display:none; }
    .notify-btn{ animation:none; transition:none; }
    .notify-btn::before{ display:none; }
  }

  /* ---------- footer ---------- */
  footer{
    background: var(--bar-soft);
    border-top:1px solid var(--border);
    padding:36px 32px 26px;
  }

  .footer-inner{
    max-width:720px;
    margin:0 auto;
    text-align:center;
  }

  .footer-inner h3{
    font-family:'Playfair Display', serif;
    font-size:1.05rem;
    color: var(--accent);
    margin-bottom:10px;
    letter-spacing:0.02em;
  }

  .footer-inner p{
    font-size:0.88rem;
    line-height:1.6;
    color: var(--text-muted);
    max-width:52ch;
    margin:0 auto 20px;
  }

  .footer-bottom{
    border-top:1px solid var(--border);
    padding-top:16px;
    font-size:0.78rem;
    color: var(--text-muted);
  }

  @media (max-width: 720px){
    .nav-center{ order:3; width:100%; justify-content:flex-start; }
    .navbar-secondary{ grid-template-columns:1fr; row-gap:8px; text-align:center; }
    .navbar-secondary .home-link{ justify-self:center; }
    .hero{ min-height:560px; }
  }
</style>
</head>
<body>

<header class="navbar-primary">
  <div class="brand">KKB</div>

  <div class="nav-center">
    <div class="device-icon" title="Desktop preview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
    </div>
    <div class="device-icon" title="Mobile preview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="2" width="10" height="20" rx="1.8"/><path d="M11 18h2"/></svg>
    </div>
    <a href="#" class="read-more">Read more</a>
  </div>

  <button class="edit-btn">Edit site name</button>
</header>

<nav class="navbar-secondary">
  <span class="studio-name">K.K Photography</span>
  <a href="#" class="home-link">Home</a>
  <span></span>
</nav>

<main class="hero">
  <div class="slide slide1"></div>
  <div class="slide slide2"></div>
  <div class="slide slide3"></div>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <h1>We are coming soon</h1>

    <div class="notify-card">
      <label for="notify-email">Enter your email</label>
      <input id="notify-email" type="email" placeholder="you@example.com" required>
      <label class="notify-check">
        <input type="checkbox">
        <span>Yes, subscribe me to your newsletter</span>
      </label>
      <button class="notify-btn">Notify me</button>
    </div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <h3>About K.K Photography</h3>
    <p>We're a studio built around candid light and honest color — weddings, portraits, and travel stories captured as they happen. Our new home online is almost ready.</p>
    <div class="footer-bottom">&copy; 2026 K.K Photography. All rights reserved.</div>
  </div>
</footer>

</body>
</html>
